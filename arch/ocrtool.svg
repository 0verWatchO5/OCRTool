<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" />
      <stop offset="100%" stop-color="#1a252f" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ecf0f1" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" />

  <!-- Document Sheet -->
  <path d="M34 26 h42 l24 24 v52 a4 4 0 0 1 -4 4 h-62 a4 4 0 0 1 -4 -4 v-72 a4 4 0 0 1 4 -4 z" fill="url(#sheetGrad)" />
  <!-- Folded Corner -->
  <path d="M76 26 v20 a4 4 0 0 0 4 4 h20 z" fill="#bdc3c7" />

  <!-- PDF Text Lines Placeholder -->
  <rect x="44" y="44" width="24" height="4" rx="2" fill="#95a5a6" />
  <rect x="44" y="54" width="44" height="4" rx="2" fill="#bdc3c7" />
  <rect x="44" y="64" width="44" height="4" rx="2" fill="#bdc3c7" />
  <rect x="44" y="74" width="34" height="4" rx="2" fill="#bdc3c7" />

  <!-- Cyan OCR Scanner Beam -->
  <rect x="26" y="62" width="76" height="8" rx="4" fill="url(#beamGrad)" filter="url(#glow)" />
  <line x1="26" y1="66" x2="102" y2="66" stroke="#00f2fe" stroke-width="2" />

  <!-- Badge Pill: OCR -->
  <rect x="36" y="86" width="56" height="22" rx="6" fill="#e74c3c" />
  <text x="64" y="102" fill="#ffffff" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">OCR</text>
</svg>
